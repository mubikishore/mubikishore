<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project — MUBIKISHORE</title><link rel="stylesheet" href="/admin/styles.css"></head><body><header class="top"><div class="logo">MUBIKISHORE</div><div class="top-right"><div class="admin-label">ADMIN / SITE CONTENT DASHBOARD</div><button class="logout" id="logout">SIGN OUT</button></div></header><div class="layout"><aside class="sidebar">
<div class="section-label">CONTENT</div>
<button class="nav-button" data-nav="dashboard">Dashboard</button>
<button class="nav-button" data-nav="projects">Projects</button>
<button class="nav-button" data-nav="project-edit">Add Project</button>
<div class="section-label">STORE</div>
<button class="nav-button" data-nav="store">Products</button>
<div class="section-label">OTHER</div>
<button class="nav-button" data-nav="other">Other Content</button>
<div class="section-label">SYSTEM</div>
<button class="nav-button" data-nav="settings">Settings</button>
</aside><main class="content"><div class="eyebrow">CONTENT / PROJECT</div><h1 id="heading">ADD PROJECT.</h1><div class="form"><div class="grid2"><div class="field"><label>TITLE</label><input id="title"></div><div class="field"><label>SLUG</label><input id="slug"></div></div><div class="grid2"><div class="field"><label>DATE</label><input id="date" type="date"></div><div class="field"><label>YEAR</label><input id="year" type="number"></div></div><div class="field"><label>ROLE</label><input id="role"></div><div class="field"><label>DESCRIPTION</label><textarea id="description"></textarea></div><div class="grid2"><div class="field"><label>HERO IMAGE</label><input id="heroFile" type="file" accept="image/*"></div><div class="field"><label>VIDEO URL</label><input id="video"></div></div><div class="field"><label>CREDITS</label><textarea id="credits"></textarea></div><div class="field"><label>GALLERY</label><input id="galleryFiles" type="file" accept="image/*" multiple></div><div class="field"><label>STATUS</label><label><input id="published" type="checkbox" checked> Published</label></div><button id="save" class="btn primary">SAVE PROJECT</button><button class="btn" onclick="location.href='/admin/projects.html'">CANCEL</button><div id="msg" class="notice" style="display:none"></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin/config.js"></script><script src="/admin/app.js"></script><script>
let id=new URLSearchParams(location.search).get("id"),hero="",gallery=[];
async function upload(f){const path="projects/"+crypto.randomUUID()+"."+f.name.split(".").pop();const r=await MUBI_SUPABASE.storage.from(MUBI_CONFIG.MEDIA_BUCKET).upload(path,f);if(r.error)throw r.error;return MUBI_SUPABASE.storage.from(MUBI_CONFIG.MEDIA_BUCKET).getPublicUrl(path).data.publicUrl}
window.addEventListener("load",async()=>{if(!id)return;heading.textContent="EDIT PROJECT.";const r=await MUBI_SUPABASE.from("projects").select("*").eq("id",id).single();if(r.error){alert(r.error.message);return}const p=r.data;["title","slug","date","year","role","description","video","credits"].forEach(k=>document.getElementById(k).value=p[k]??"");published.checked=p.published!==false;hero=p.hero||"";gallery=p.gallery||[]});
save.onclick=async()=>{msg.style.display="block";msg.textContent="Saving...";try{if(!title.value.trim())throw Error("Title is required.");if(!slug.value.trim())slug.value=title.value.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");const hf=heroFile.files[0];if(hf)hero=await upload(hf);const gf=[...galleryFiles.files];if(gf.length){const urls=await Promise.all(gf.map(upload));gallery=[...gallery,...urls.map(x=>({image:x}))]}const payload={title:title.value.trim(),slug:slug.value.trim(),date:date.value||null,year:Number(year.value)||null,role:role.value.trim(),hero,video:video.value.trim(),description:description.value.trim(),credits:credits.value.trim(),gallery,published:published.checked};const r=id?await MUBI_SUPABASE.from("projects").update(payload).eq("id",id):await MUBI_SUPABASE.from("projects").insert(payload);if(r.error)throw r.error;location.href="/admin/projects.html"}catch(e){msg.textContent=e.message}};
</script></body></html>
