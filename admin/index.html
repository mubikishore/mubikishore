<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MUBIKISHORE CMS</title>
<style>#nf-auth{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);font:14px Arial,sans-serif}#nf-auth form{background:#fff;color:#222;padding:28px;border-radius:6px;width:min(360px,90vw);display:flex;flex-direction:column;gap:12px}#nf-auth h2{margin:0;font-size:18px}#nf-auth input{padding:10px;border:1px solid #ccc;border-radius:4px;font:inherit}#nf-auth button{padding:10px;border:0;border-radius:4px;background:#222;color:#fff;font:inherit;cursor:pointer}#nf-auth button:disabled{opacity:.6}#nf-auth .msg{margin:0;font-size:13px}#nf-auth .err{color:#b00020}</style>
</head><body>
<script>window.__nfAuthHash=location.hash</script>
<script type="module">
// Handles Netlify Identity email links (password recovery, invites, email confirmation)
// before handing off to Decap CMS's own login screen.
// Decap uses hash routing, so restore the hash captured before it loaded.
const hash = window.__nfAuthHash || "";
if (/(invite|recovery|confirmation|email_change)_token=/.test(hash)) {
  history.replaceState(null, "", location.pathname + location.search + hash);
  const { handleAuthCallback, updateUser, acceptInvite } = await import("https://esm.sh/@netlify/identity@2");

  const overlay = (title, withPassword, onSubmit) => {
    const root = document.createElement("div");
    root.id = "nf-auth";
    root.innerHTML = `<form><h2></h2>${withPassword ? '<input type="password" name="password" placeholder="New password" autocomplete="new-password" required minlength="6"><input type="password" name="confirm" placeholder="Confirm password" autocomplete="new-password" required minlength="6">' : ""}<p class="msg"></p><button type="submit"></button></form>`;
    const form = root.querySelector("form");
    const msg = root.querySelector(".msg");
    const btn = root.querySelector("button");
    root.querySelector("h2").textContent = title;
    btn.textContent = withPassword ? "Save password" : "Continue to login";
    const showError = (text) => { msg.className = "msg err"; msg.textContent = text; };
    const done = (text) => {
      form.querySelectorAll("input").forEach((i) => i.remove());
      msg.className = "msg";
      msg.textContent = text;
      btn.disabled = false;
      btn.textContent = "Continue to login";
      form.onsubmit = (e) => { e.preventDefault(); root.remove(); };
    };
    form.onsubmit = async (e) => {
      e.preventDefault();
      if (!onSubmit) return root.remove();
      const password = form.password.value;
      if (password !== form.confirm.value) return showError("Passwords do not match.");
      btn.disabled = true;
      try {
        await onSubmit(password);
        done("Password saved. Log in with your email and new password.");
      } catch (err) {
        btn.disabled = false;
        showError(err?.message || "Something went wrong. Please try again.");
      }
    };
    document.body.appendChild(root);
    return { showError, done };
  };

  try {
    const result = await handleAuthCallback();
    if (result?.type === "recovery") {
      overlay("Reset your password", true, (password) => updateUser({ password }));
    } else if (result?.type === "invite") {
      overlay("Accept your invite", true, (password) => acceptInvite(result.token, password));
    } else if (result?.type === "confirmation") {
      overlay("Email confirmed", false).done("Your email is confirmed. You can now log in.");
    } else if (result?.type === "email_change") {
      overlay("Email updated", false).done("Your email address has been updated.");
    }
  } catch (err) {
    history.replaceState(null, "", location.pathname + location.search);
    overlay("Link problem", false).showError((err?.message || "This link is invalid or has expired.") + " Request a new link and try again.");
  }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js"></script></body></html>
