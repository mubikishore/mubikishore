<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUBIKISHORE — ADMIN</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #080808;
      color: #f1f1ed;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login {
      width: 100%;
      max-width: 420px;
    }

    .brand {
      margin-bottom: 70px;
    }

    .brand-name {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .brand-sub {
      margin-top: 8px;
      font-size: 10px;
      letter-spacing: 0.18em;
      color: #777;
    }

    .label {
      font-size: 10px;
      letter-spacing: 0.16em;
      color: #777;
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      height: 52px;
      background: transparent;
      border: 1px solid #333;
      color: #fff;
      padding: 0 15px;
      font-size: 15px;
      outline: none;
      margin-bottom: 18px;
    }

    input:focus {
      border-color: #888;
    }

    button {
      width: 100%;
      height: 52px;
      border: 0;
      background: #f1f1ed;
      color: #080808;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      cursor: pointer;
      margin-top: 6px;
    }

    button:hover {
      background: #d8d8d3;
    }

    #message {
      min-height: 20px;
      margin-top: 18px;
      font-size: 12px;
      color: #999;
      line-height: 1.5;
    }

    .footer {
      position: fixed;
      bottom: 24px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      letter-spacing: 0.12em;
      color: #555;
    }
  </style>
</head>

<body>

  <main class="login">

    <div class="brand">
      <div class="brand-name">MUBIKISHORE</div>
      <div class="brand-sub">ADMIN / SITE CONTENT DASHBOARD</div>
    </div>

    <form id="login-form">

      <div class="label">EMAIL</div>
      <input
        id="email"
        type="email"
        placeholder="admin@email.com"
        required
      >

      <div class="label">PASSWORD</div>
      <input
        id="password"
        type="password"
        placeholder="••••••••"
        required
      >

      <button type="submit">SIGN IN</button>

      <div id="message"></div>

    </form>

  </main>

  <div class="footer">
    <span>MUBIKISHORE</span>
    <span>PRIVATE / ADMIN</span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const form = document.getElementById("login-form");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      message.textContent = "SIGNING IN...";

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const { error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        message.textContent = error.message;
        return;
      }

      window.location.href = "/admin/dashboard.html";
    });
  </script>

</body>
</html>
