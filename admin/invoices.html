<script>
(function () {
  "use strict";

  const db = window.MUBI_SUPABASE;
  const $ = id => document.getElementById(id);
  const money = n => new Intl.NumberFormat("en-IN", {
    style: "currency",
    currency: "INR"
  }).format(Number(n) || 0);

  const today = () => {
    const d = new Date();
    return new Intl.DateTimeFormat("en-CA", {
      timeZone: "Asia/Kolkata",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).format(d);
  };

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[c]);

  let clients = [];
  let invoices = [];
  let settings = {};
  let currentInvoice = null;

  function say(message) {
    const status = $("main-status");
    if (status) status.textContent = message || "";
  }

  // FIX: reliable switching between invoice tabs
  function goTab(id) {
    const panel = document.getElementById(id);

    if (!panel || !panel.classList.contains("inv-panel")) {
      say("Could not find tab: " + id);
      return;
    }

    document.querySelectorAll(".inv-panel").forEach(p => {
      p.classList.toggle("active", p.id === id);
    });

    document.querySelectorAll("[data-tab]").forEach(button => {
      button.classList.toggle("active", button.dataset.tab === id);
    });

    say("");
  }

  document.addEventListener("click", event => {
    const button = event.target.closest("[data-tab]");
    if (!button) return;

    event.preventDefault();
    goTab(button.dataset.tab);
  });

  $("create-invoice").onclick = () => newInvoice();
  $("cancel-edit").onclick = () => goTab("list-panel");
  $("back-to-list").onclick = () => goTab("list-panel");
  $("add-item").onclick = () => addItem();

  $("reset-client").onclick = () => {
    $("client-form").reset();
    $("client-id").value = "";
  };

  $("record-payment").onclick = () => {
    $("payment-box").classList.toggle("inv-hidden");
    $("payment-date").value = today();
  };

  $("print-invoice").onclick = () => window.print();

  $("save-sent").onclick = () => {
    $("invoice-status-hidden").value = "sent";
    $("invoice-form").requestSubmit();
  };

  function addItem(item = {}) {
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td><input class="desc" aria-label="Description" required value="${esc(item.description || "")}"></td>
      <td><input class="qty" aria-label="Quantity" type="number" min="0.001" step="0.001" value="${Number(item.quantity ?? 1)}"></td>
      <td><input class="rate" aria-label="Rate" type="number" min="0" step="0.01" value="${Number(item.rate ?? 0)}"></td>
      <td class="amount">${money(item.amount || 0)}</td>
      <td><button type="button" class="inv-btn danger remove-item">×</button></td>
    `;

    tr.querySelectorAll("input").forEach(input => {
      input.addEventListener("input", calculate);
    });

    tr.querySelector(".remove-item").onclick = () => {
      tr.remove();
      calculate();
    };

    $("item-rows").appendChild(tr);
    calculate();
  }

  function itemData() {
    return [...$("item-rows").rows].map((row, index) => {
      const quantity = Number(row.querySelector(".qty").value) || 0;
      const rate = Number(row.querySelector(".rate").value) || 0;

      return {
        description: row.querySelector(".desc").value.trim(),
        quantity,
        rate,
        amount: Math.round(quantity * rate * 100) / 100,
        sort_order: index
      };
    }).filter(item => item.description && item.quantity > 0);
  }

  function calculate() {
    let subtotal = 0;

    [...$("item-rows").rows].forEach(row => {
      const quantity = Number(row.querySelector(".qty").value) || 0;
      const rate = Number(row.querySelector(".rate").value) || 0;
      const amount = Math.round(quantity * rate * 100) / 100;

      subtotal += amount;
      row.querySelector(".amount").textContent = money(amount);
    });

    const taxPercent = Math.min(
      100,
      Math.max(0, Number($("tax-percent").value) || 0)
    );

    const tax = Math.round(subtotal * taxPercent) / 100;

    $("form-subtotal").textContent = money(subtotal);
    $("form-tax").textContent = money(tax);
    $("form-total").textContent = money(subtotal + tax);

    return {
      subtotal: Math.round(subtotal * 100) / 100,
      tax: Math.round(tax * 100) / 100,
      total: Math.round((subtotal + tax) * 100) / 100
    };
  }

  $("tax-percent").addEventListener("input", calculate);

  async function loadSettings() {
    const { data, error } = await db
      .from("invoice_settings")
      .select("*")
      .eq("id", 1)
      .maybeSingle();

    if (error) throw error;

    settings = data || {};

    const fields = {
      "business-name": "business_name",
      "business-address": "business_address",
      "business-email": "business_email",
      "business-phone": "business_phone",
      "business-gstin": "business_gstin",
      "business-pan": "business_pan",
      "business-upi": "upi_id",
      "bank-name": "bank_name",
      "bank-account-name": "bank_account_name",
      "bank-account-number": "bank_account_number",
      "bank-ifsc": "bank_ifsc",
      "bank-branch": "bank_branch",
      "business-prefix": "invoice_prefix",
      "default-terms": "default_terms",
      "default-tax": "default_tax_percent"
    };

    Object.entries(fields).forEach(([id, key]) => {
      $(id).value = settings[key] ?? "";
    });
  }

  async function loadClients() {
    const { data, error } = await db
      .from("invoice_clients")
      .select("*")
      .order("name");

    if (error) throw error;

    clients = data || [];

    $("client-rows").innerHTML = clients.map(client => `
      <tr>
        <td>${esc(client.name)}</td>
        <td>${esc(client.email)}</td>
        <td>${esc(client.phone)}</td>
        <td>
          <div class="inv-actions">
            <button class="inv-btn edit-client" data-id="${client.id}">EDIT</button>
            <button class="inv-btn danger delete-client" data-id="${client.id}">DELETE</button>
          </div>
        </td>
      </tr>
    `).join("") || `
      <tr><td colspan="4" class="muted">No clients yet.</td></tr>
    `;

    $("client-select").innerHTML =
      '<option value="">Choose a client</option>' +
      clients.map(client =>
        `<option value="${client.id}">${esc(client.name)}</option>`
      ).join("");
  }

  async function loadInvoices() {
    const { data, error } = await db
      .from("invoices")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) throw error;

    invoices = (data || []).map(invoice => {
      const unpaid = Number(invoice.amount_paid || 0) < Number(invoice.total || 0);

      if (
        invoice.status !== "draft" &&
        invoice.status !== "paid" &&
        unpaid &&
        invoice.due_date < today()
      ) {
        return { ...invoice, status: "overdue" };
      }

      return invoice;
    });

    renderInvoices();
    renderSummary();
  }

  function clientName(invoice) {
    return invoice.client_snapshot?.name ||
      clients.find(client => client.id === invoice.client_id)?.name ||
      "—";
  }

  function renderInvoices() {
    const query = $("search").value.toLowerCase().trim();
    const status = $("status-filter").value;

    const rows = invoices.filter(invoice =>
      (!status || invoice.status === status) &&
      (!query || (
        (invoice.invoice_number + " " + clientName(invoice))
          .toLowerCase().includes(query)
      ))
    );

    $("invoice-list").innerHTML = rows.length ? `
      <table class="inv-table">
        <thead>
          <tr>
            <th>INVOICE</th><th>CLIENT</th><th>DATE</th>
            <th>TOTAL</th><th>STATUS</th><th>ACTIONS</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(invoice => `
            <tr>
              <td><strong>${esc(invoice.invoice_number)}</strong></td>
              <td>${esc(clientName(invoice))}</td>
              <td>${esc(invoice.invoice_date)}</td>
              <td>${money(invoice.total)}</td>
              <td><span class="inv-status">${esc(invoice.status.replace("_", " "))}</span></td>
              <td>
                <div class="inv-actions">
                  <button class="inv-btn open-invoice" data-id="${invoice.id}">OPEN</button>
                  <button class="inv-btn edit-invoice" data-id="${invoice.id}">EDIT</button>
                </div>
              </td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    ` : '<div class="inv-empty">No invoices found.</div>';
  }

  function renderSummary() {
    const total = invoices.reduce((sum, invoice) =>
      sum + Number(invoice.total || 0), 0);

    const paid = invoices.reduce((sum, invoice) =>
      sum + Number(invoice.amount_paid || 0), 0);

    const outstanding = invoices
      .filter(invoice => invoice.status !== "draft")
      .reduce((sum, invoice) =>
        sum + Math.max(0, Number(invoice.total) - Number(invoice.amount_paid || 0)), 0);

    const overdue = invoices
      .filter(invoice => invoice.status === "overdue")
      .reduce((sum, invoice) =>
        sum + Math.max(0, Number(invoice.total) - Number(invoice.amount_paid || 0)), 0);

    $("sum-total").textContent = money(total);
    $("sum-paid").textContent = money(paid);
    $("sum-outstanding").textContent = money(outstanding);
    $("sum-overdue").textContent = money(overdue);
  }

  $("search").oninput = renderInvoices;
  $("status-filter").onchange = renderInvoices;

  function newInvoice() {
    $("invoice-form").reset();
    $("invoice-id").value = "";
    $("invoice-number").value = "";
    $("invoice-status-hidden").value = "draft";
    $("form-title").textContent = "Create invoice";

    $("invoice-date").value = today();

    const due = new Date(today() + "T12:00:00");
    due.setDate(due.getDate() + 7);
    $("due-date").value = due.toLocaleDateString("en-CA");

    $("invoice-terms").value =
      settings.default_terms || "Payment due within 7 days.";

    $("tax-percent").value = settings.default_tax_percent || 0;
    $("item-rows").innerHTML = "";
    addItem();
    goTab("invoice-form-panel");
  }

  function editInvoice(id) {
    const invoice = invoices.find(item => item.id === id);
    if (!invoice) return;

    $("invoice-form").reset();
    $("invoice-id").value = invoice.id;
    $("invoice-number").value = invoice.invoice_number;
    $("invoice-status-hidden").value = invoice.status || "draft";
    $("form-title").textContent = "Edit " + invoice.invoice_number;

    $("client-select").value = invoice.client_id || "";
    $("invoice-date").value = invoice.invoice_date;
    $("due-date").value = invoice.due_date;
    $("tax-percent").value = invoice.tax_percent || 0;
    $("invoice-notes").value = invoice.notes || "";
    $("invoice-terms").value = invoice.terms || "";
    $("item-rows").innerHTML = "";

    db.from("invoice_items")
      .select("*")
      .eq("invoice_id", id)
      .order("sort_order")
      .then(({ data, error }) => {
        if (error) {
          say(error.message);
          return;
        }

        (data || []).forEach(addItem);
        if (!data?.length) addItem();
      });

    goTab("invoice-form-panel");
  }

  async function openInvoice(id) {
    const invoice = invoices.find(item => item.id === id);
    if (!invoice) return;

    const { data: items, error } = await db
      .from("invoice_items")
      .select("*")
      .eq("invoice_id", id)
      .order("sort_order");

    if (error) throw error;

    currentInvoice = invoice;

    const business = invoice.business_snapshot || {};
    const client = invoice.client_snapshot || {};
    const paymentDetails = [];

    if (business.upi_id) paymentDetails.push("UPI: " + esc(business.upi_id));
    if (business.bank_name) paymentDetails.push("Bank: " + esc(business.bank_name));
    if (business.bank_account_name) paymentDetails.push("Account name: " + esc(business.bank_account_name));
    if (business.bank_account_number) paymentDetails.push("Account number: " + esc(business.bank_account_number));
    if (business.bank_ifsc) paymentDetails.push("IFSC: " + esc(business.bank_ifsc));
    if (business.bank_branch) paymentDetails.push("Branch: " + esc(business.bank_branch));

    const rows = (items || []).map(item => `
      <tr>
        <td>${esc(item.description)}</td>
        <td>${Number(item.quantity)}</td>
        <td>${money(item.rate)}</td>
        <td>${money(item.amount)}</td>
      </tr>
    `).join("");

    $("invoice-paper").innerHTML = `
      <div class="inv-paper">
        <div class="paper-head">
          <div>
            <h2>${esc(business.business_name || "MUBIKISHORE")}</h2>
            <div class="paper-muted">
              ${esc(business.business_address || "").replace(/\n/g, "<br>")}<br>
              ${esc(business.business_email || "")} ${esc(business.business_phone || "")}<br>
              ${business.business_gstin ? "GSTIN: " + esc(business.business_gstin) : ""}
            </div>
          </div>
          <div style="text-align:right">
            <h2>INVOICE</h2>
            <div class="paper-muted">
              ${esc(invoice.invoice_number)}<br>
              Date: ${esc(invoice.invoice_date)}<br>
              Due: ${esc(invoice.due_date)}<br>
              Status: ${esc(invoice.status.replace("_", " "))}
            </div>
          </div>
        </div>

        <div class="paper-meta">
          <div>
            <strong>BILL TO</strong>
            <div class="paper-muted">
              ${esc(client.name || "")}<br>
              ${esc(client.billing_address || "").replace(/\n/g, "<br>")}<br>
              ${esc(client.email || "")}<br>
              ${client.gstin ? "GSTIN: " + esc(client.gstin) : ""}
            </div>
          </div>
          <div>
            <strong>PAYMENT DETAILS</strong>
            <div class="paper-muted">
              ${paymentDetails.join("<br>") || "Payment details not provided."}
            </div>
          </div>
        </div>

        <table>
          <thead>
            <tr><th>Description</th><th>Qty</th><th>Rate</th><th>Amount</th></tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>

        <div class="paper-totals">
          <div class="paper-total"><span>Subtotal</span><span>${money(invoice.subtotal)}</span></div>
          <div class="paper-total"><span>Tax (${Number(invoice.tax_percent)}%)</span><span>${money(invoice.tax_amount)}</span></div>
          <div class="paper-total paper-grand"><strong>Total</strong><strong>${money(invoice.total)}</strong></div>
          <div class="paper-total"><span>Paid</span><span>${money(invoice.amount_paid)}</span></div>
          <div class="paper-total"><strong>Balance due</strong><strong>${money(Math.max(0, Number(invoice.total) - Number(invoice.amount_paid || 0)))}</strong></div>
        </div>

        <div class="paper-foot">
          ${invoice.notes ? esc(invoice.notes).replace(/\n/g, "<br>") + "<br><br>" : ""}
          <strong>Terms</strong><br>
          ${esc(invoice.terms || "").replace(/\n/g, "<br>")}<br><br>
          Thank you.
        </div>
      </div>
    `;

    $("payment-box").classList.add("inv-hidden");
    goTab("print-panel");
  }

  document.addEventListener("click", async event => {
    const editClient = event.target.closest(".edit-client");
    const deleteClient = event.target.closest(".delete-client");
    const open = event.target.closest(".open-invoice");
    const editInv = event.target.closest(".edit-invoice");

    try {
      if (editClient) {
        const client = clients.find(item => item.id === editClient.dataset.id);
        if (!client) return;

        $("client-id").value = client.id;
        $("client-name").value = client.name || "";
        $("client-email").value = client.email || "";
        $("client-phone").value = client.phone || "";
        $("client-gstin").value = client.gstin || "";
        $("client-pan").value = client.pan || "";
        $("client-address").value = client.billing_address || "";
        goTab("clients-panel");
      }

      if (deleteClient) {
        if (!confirm("Delete this client?")) return;

        const { error } = await db
          .from("invoice_clients")
          .delete()
          .eq("id", deleteClient.dataset.id);

        if (error) throw error;

        await loadClients();
        say("Client deleted.");
      }

      if (open) await openInvoice(open.dataset.id);
      if (editInv) editInvoice(editInv.dataset.id);
    } catch (error) {
      say(error.message || String(error));
    }
  });

  $("client-form").onsubmit = async event => {
    event.preventDefault();
    say("Saving client…");

    try {
      const id = $("client-id").value;

      const client = {
        name: $("client-name").value.trim(),
        email: $("client-email").value.trim(),
        phone: $("client-phone").value.trim(),
        gstin: $("client-gstin").value.trim(),
        pan: $("client-pan").value.trim(),
        billing_address: $("client-address").value.trim(),
        updated_at: new Date().toISOString()
      };

      const result = id
        ? await db.from("invoice_clients").update(client).eq("id", id)
        : await db.from("invoice_clients").insert(client);

      if (result.error) throw result.error;

      $("client-form").reset();
      $("client-id").value = "";
      await loadClients();
      say("Client saved.");
    } catch (error) {
      say(error.message || String(error));
    }
  };

  $("settings-form").onsubmit = async event => {
    event.preventDefault();
    say("Saving business details…");

    try {
      const obj = {
        id: 1,
        business_name: $("business-name").value.trim(),
        business_address: $("business-address").value.trim(),
        business_email: $("business-email").value.trim(),
        business_phone: $("business-phone").value.trim(),
        business_gstin: $("business-gstin").value.trim(),
        business_pan: $("business-pan").value.trim(),
        upi_id: $("business-upi").value.trim(),
        bank_name: $("bank-name").value.trim(),
        bank_account_name: $("bank-account-name").value.trim(),
        bank_account_number: $("bank-account-number").value.trim(),
        bank_ifsc: $("bank-ifsc").value.trim(),
        bank_branch: $("bank-branch").value.trim(),
        invoice_prefix: $("business-prefix").value.trim() || "MUBI",
        default_terms: $("default-terms").value.trim(),
        default_tax_percent: Number($("default-tax").value) || 0,
        updated_at: new Date().toISOString()
      };

      const { error } = await db
        .from("invoice_settings")
        .upsert(obj, { onConflict: "id" });

      if (error) throw error;

      settings = obj;
      say("Business details saved.");
    } catch (error) {
      say(error.message || String(error));
    }
  };

  $("invoice-form").onsubmit = async event => {
    event.preventDefault();
    say("Saving invoice…");

    try {
      const client = clients.find(item => item.id === $("client-select").value);
      if (!client) throw new Error("Choose a client first.");

      const items = itemData();
      if (!items.length) throw new Error("Add at least one valid line item.");

      const sums = calculate();
      const id = $("invoice-id").value;
      const status = $("invoice-status-hidden").value || "draft";

      const clientSnapshot = {
        name: client.name,
        email: client.email,
        phone: client.phone,
        billing_address: client.billing_address,
        gstin: client.gstin,
        pan: client.pan
      };

      const businessSnapshot = {
        business_name: settings.business_name,
        business_address: settings.business_address,
        business_email: settings.business_email,
        business_phone: settings.business_phone,
        business_gstin: settings.business_gstin,
        business_pan: settings.business_pan,
        upi_id: settings.upi_id,
        bank_name: settings.bank_name,
        bank_account_name: settings.bank_account_name,
        bank_account_number: settings.bank_account_number,
        bank_ifsc: settings.bank_ifsc,
        bank_branch: settings.bank_branch
      };

      const invoice = {
        invoice_date: $("invoice-date").value,
        due_date: $("due-date").value,
        client_id: client.id,
        client_snapshot: clientSnapshot,
        business_snapshot: businessSnapshot,
        currency: "INR",
        status,
        notes: $("invoice-notes").value.trim(),
        terms: $("invoice-terms").value.trim(),
        tax_percent: Number($("tax-percent").value) || 0,
        subtotal: sums.subtotal,
        tax_amount: sums.tax,
        total: sums.total,
        updated_at: new Date().toISOString()
      };

      let saved;

      if (id) {
        const { data, error } = await db
          .from("invoices")
          .update(invoice)
          .eq("id", id)
          .select()
          .single();

        if (error) throw error;
        saved = data;

        const { error: deleteError } = await db
          .from("invoice_items")
          .delete()
          .eq("invoice_id", id);

        if (deleteError) throw deleteError;
      } else {
        const { data: number, error: numberError } =
          await db.rpc("next_mubi_invoice_number");

        if (numberError) throw numberError;

        invoice.invoice_number = number;

        const { data, error } = await db
          .from("invoices")
          .insert(invoice)
          .select()
          .single();

        if (error) throw error;
        saved = data;
      }

      const { error: itemError } = await db
        .from("invoice_items")
        .insert(items.map(item => ({ ...item, invoice_id: saved.id })));

      if (itemError) throw itemError;

      await loadInvoices();
      say("Invoice saved: " + saved.invoice_number);
      await openInvoice(saved.id);
    } catch (error) {
      say(error.message || String(error));
    }
  };

  $("payment-form").onsubmit = async event => {
    event.preventDefault();
    if (!currentInvoice) return;

    const amount = Number($("payment-amount").value);
    const remaining = Number(currentInvoice.total) - Number(currentInvoice.amount_paid || 0);

    if (amount <= 0 || amount > remaining + 0.001) {
      say("Enter an amount up to the remaining balance of " + money(remaining));
      return;
    }

    say("Saving payment…");

    try {
      const payment = {
        invoice_id: currentInvoice.id,
        amount,
        payment_date: $("payment-date").value,
        method: $("payment-method").value,
        reference: $("payment-reference").value.trim(),
        notes: $("payment-notes").value.trim()
      };

      const { error } = await db.from("invoice_payments").insert(payment);
      if (error) throw error;

      const paid = Math.round((Number(currentInvoice.amount_paid || 0) + amount) * 100) / 100;
      const status = paid >= Number(currentInvoice.total) ? "paid" : "partially_paid";

      const { error: updateError } = await db
        .from("invoices")
        .update({
          amount_paid: paid,
          status,
          updated_at: new Date().toISOString()
        })
        .eq("id", currentInvoice.id);

      if (updateError) throw updateError;

      const invoiceId = currentInvoice.id;
      $("payment-form").reset();
      await loadInvoices();
      await openInvoice(invoiceId);
      say("Payment recorded.");
    } catch (error) {
      say(error.message || String(error));
    }
  };

  async function init() {
    if (!db) {
      say("Supabase client not found. Check /admin/config.js.");
      return;
    }

    try {
      const { data: { session }, error } = await db.auth.getSession();
      if (error) throw error;

      if (!session) {
        location.href = "/admin/login.html";
        return;
      }

      await loadSettings();
      await loadClients();
      await loadInvoices();

      $("invoice-date").value = today();
      $("payment-date").value = today();
    } catch (error) {
      // Corrected syntax here so the entire script can run.
      say("Could not load invoice manager: " + (error.message || String(error)));
    }
  }

  // Needed by SAVE AS SENT and invoice saving.
  if (!$("invoice-status-hidden")) {
    const hidden = document.createElement("input");
    hidden.type = "hidden";
    hidden.id = "invoice-status-hidden";
    hidden.value = "draft";
    $("invoice-form").prepend(hidden);
  }

  init();
})();
</script>
