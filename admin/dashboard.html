<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MUBIKISHORE — ADMIN</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #080808;
      color: #f1f1ed;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .top {
      height: 72px;
      border-bottom: 1px solid #292929;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
    }

    .logo {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .admin-label {
      font-size: 9px;
      letter-spacing: 0.18em;
      color: #777;
    }

    .logout {
      border: 1px solid #333;
      background: transparent;
      color: #aaa;
      padding: 9px 14px;
      font-size: 9px;
      letter-spacing: 0.12em;
      cursor: pointer;
    }

    .logout:hover {
      border-color: #777;
      color: #fff;
    }

    .layout {
      display: grid;
      grid-template-columns: 230px 1fr;
      min-height: calc(100vh - 72px);
    }

    .sidebar {
      border-right: 1px solid #292929;
      padding: 34px 24px;
    }

    .section-label {
      font-size: 9px;
      letter-spacing: 0.18em;
      color: #555;
      margin: 28px 0 12px;
    }

    .section-label:first-child {
      margin-top: 0;
    }

    .nav-button {
      width: 100%;
      display: block;
      text-align: left;
      border: 0;
      background: transparent;
      color: #888;
      padding: 11px 0;
      font-size: 12px;
      cursor: pointer;
    }

    .nav-button:hover,
    .nav-button.active {
      color: #fff;
    }

    .content {
      padding: 48px;
      max-width: 1200px;
    }

    .eyebrow {
      font-size: 9px;
      letter-spacing: 0.2em;
      color: #666;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 7vw, 90px);
      font-weight: 400;
      letter-spacing: -0.06em;
      line-height: 0.9;
    }

    .intro {
      margin-top: 24px;
      color: #777;
      font-size: 13px;
      line-height: 1.6;
      max-width: 520px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      margin-top: 60px;
      border: 1px solid #292929;
      background: #292929;
    }

    .card {
      min-height: 170px;
      background: #080808;
      padding: 24px;
    }

    .card-label {
      font-size: 9px;
      letter-spacing: 0.18em;
      color: #666;
    }

    .card-number {
      margin-top: 45px;
      font-size: 46px;
      font-weight: 400;
      letter-spacing: -0.05em;
    }

    .projects {
      margin-top: 60px;
    }

    .projects-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #292929;
      padding-bottom: 14px;
    }

    .projects-title {
      font-size: 10px;
      letter-spacing: 0.18em;
    }

    .status {
      font-size: 10px;
      color: #666;
    }

    #project-list {
      min-height: 80px;
    }

    .project-row {
      display: grid;
      grid-template-columns: 1fr 130px 100px;
      gap: 20px;
      padding: 18px 0;
      border-bottom: 1px solid #1d1d1d;
      font-size: 12px;
    }

    .project-date,
    .project-role {
      color: #666;
      font-size: 10px;
    }

    .message {
      padding: 24px 0;
      color: #666;
      font-size: 12px;
    }

    @media (max-width: 800px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid #292929;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .content {
        padding: 30px 20px;
      }

      .top {
        padding: 0 20px;
      }

      .project-row {
        grid-template-columns: 1fr;
        gap: 7px;
      }
    }
  </style>
</head>

<body>

  <header class="top">
    <div class="logo">MUBIKISHORE</div>

    <div class="top-right">
      <div class="admin-label">ADMIN / SITE CONTENT DASHBOARD</div>
      <button class="logout" id="logout">SIGN OUT</button>
    </div>
  </header>


  <div class="layout">

    <aside class="sidebar">

      <div class="section-label">CONTENT</div>

      <button class="nav-button active">
        Dashboard
      </button>

      <button class="nav-button">
        Projects
      </button>

      <button class="nav-button">
        Add Project
      </button>


      <div class="section-label">STORE</div>

      <button class="nav-button">
        Products
      </button>

      <button class="nav-button">
        Add Product
      </button>


      <div class="section-label">OTHER</div>

      <button class="nav-button">
        Other Content
      </button>


      <div class="section-label">SYSTEM</div>

      <button class="nav-button">
        Settings
      </button>

    </aside>


    <main class="content">

      <div class="eyebrow">WELCOME BACK</div>

      <h1>ADMIN.</h1>

      <p class="intro">
        Manage MUBIKISHORE website content, projects, images and store
        information from one place.
      </p>


      <section class="cards">

        <div class="card">
          <div class="card-label">PROJECTS</div>
          <div class="card-number" id="project-count">—</div>
        </div>

        <div class="card">
          <div class="card-label">PUBLISHED</div>
          <div class="card-number" id="published-count">—</div>
        </div>

        <div class="card">
          <div class="card-label">STORE</div>
          <div class="card-number">—</div>
        </div>

      </section>


      <section class="projects">

        <div class="projects-header">
          <div class="projects-title">
            RECENT PROJECTS
          </div>

          <div class="status" id="status">
            LOADING
          </div>
        </div>

        <div id="project-list">
          <div class="message">
            Loading projects...
          </div>
        </div>

      </section>

    </main>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://ycchdnnugjacqaqojtvp.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_d0rdksXSPd2ab7FZZZGxrw_oP7wzIpD";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


    async function startDashboard() {

      const {
        data: {
          session
        }
      } = await supabaseClient.auth.getSession();


      if (!session) {

        window.location.href = "/admin/login.html";

        return;

      }


      loadProjects();

    }


    async function loadProjects() {

      const {
        data,
        error
      } = await supabaseClient
        .from("projects")
        .select("*")
        .order("date", {
          ascending: false
        });


      if (error) {

        document.getElementById("status").textContent =
          "DATABASE CONNECTION";

        document.getElementById("project-list").innerHTML =
          '<div class="message">Projects will appear here once database access is configured.</div>';

        return;

      }


      const projects = data || [];


      document.getElementById("project-count").textContent =
        projects.length;


      document.getElementById("published-count").textContent =
        projects.filter(project => project.published).length;


      document.getElementById("status").textContent =
        "CONNECTED";


      if (projects.length === 0) {

        document.getElementById("project-list").innerHTML =
          '<div class="message">No projects in Supabase yet.</div>';

        return;

      }


      document.getElementById("project-list").innerHTML =
        projects.slice(0, 10).map(project => {

          return `
            <div class="project-row">

              <div>
                ${escapeHtml(project.title || "Untitled")}
              </div>

              <div class="project-date">
                ${escapeHtml(project.date || "")}
              </div>

              <div class="project-role">
                ${escapeHtml(project.role || "")}
              </div>

            </div>
          `;

        }).join("");

    }


    function escapeHtml(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    document
      .getElementById("logout")
      .addEventListener("click", async () => {

        await supabaseClient.auth.signOut();

        window.location.href = "/admin/login.html";

      });


    startDashboard();

  </script>

</body>
</html>
