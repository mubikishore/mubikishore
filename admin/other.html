<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OTHER CONTENT.</title>
  <link rel="stylesheet" href="/admin/styles.css">
  <style>
    .other-actions{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}
    .other-form{border:1px solid #333;padding:24px;margin:20px 0}
    .other-form label{display:block;margin:16px 0 8px}
    .other-form input:not([type=checkbox]):not([type=file]),
    .other-form textarea,.other-form select{
      display:block;width:100%;box-sizing:border-box;padding:12px;
      background:#111;color:#eee;border:1px solid #444;font:inherit
    }
    .other-form textarea{min-height:100px;resize:vertical}
    .other-form input[type=checkbox]{width:auto}
    .other-preview{display:block;max-width:300px;max-height:220px;
      object-fit:contain;margin:16px 0;border:1px solid #333}
    .other-card{display:grid;grid-template-columns:160px minmax(0,1fr);
      gap:20px;padding:20px;border:1px solid #333;margin:16px 0}
    .other-card img{width:100%;height:130px;object-fit:cover;background:#181818}
    .other-card h2{font-size:22px;margin:0 0 10px}
    .other-card-actions,.other-form-actions{display:flex;gap:8px;
      flex-wrap:wrap;margin-top:16px}
    .other-card-actions button,.other-actions button,
    .other-form-actions button{padding:12px 16px;cursor:pointer}
    .other-status{color:#aaa;margin:16px 0;overflow-wrap:anywhere}
    .other-danger{border:1px solid #a44!important}
    .other-check{display:flex!important;align-items:center;gap:10px}
    @media(max-width:600px){
      .other-card{grid-template-columns:1fr}
      .other-card img{height:200px}
      .other-form{padding:16px}
    }
  </style>
</head>
<body>
<header class="top">
  <div class="logo">MUBIKISHORE</div>
  <div class="top-right">
    <div class="admin-label">ADMIN / SITE CONTENT DASHBOARD</div>
    <button class="logout" id="logout">SIGN OUT</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="section-label">CONTENT</div>
    <button class="nav-button" data-nav="dashboard">Dashboard</button>
    <button class="nav-button" data-nav="projects">Projects</button>
    <button class="nav-button" data-nav="project-edit">Add Project</button>
    <div class="section-label">STORE</div>
    <button class="nav-button" data-nav="store">Products</button>
    <div class="section-label">OTHER</div>
    <button class="nav-button" data-nav="other">Other Content</button>
    <div class="section-label">SYSTEM</div>
    <button class="nav-button" data-nav="settings">Settings</button>
  </aside>

  <main class="content">
    <div class="eyebrow">ADMIN / ARCHIVE</div>
    <h1>OTHER CONTENT.</h1>
    <p class="intro">Manage photography, 35mm, behind-the-scenes, stills and experiments.</p>

    <div class="other-actions">
      <button id="add-other" type="button">+ ADD CONTENT</button>
      <button id="refresh-other" type="button">REFRESH</button>
    </div>

    <p id="other-status" class="other-status" role="status">Loading content…</p>

    <form id="other-form" class="other-form" hidden>
      <h2 id="form-heading">ADD CONTENT</h2>
      <input id="other-id" type="hidden">

      <label for="other-title">Title *</label>
      <input id="other-title" required maxlength="200"
        placeholder="e.g. 35mm diary">

      <label for="other-type">Category</label>
      <select id="other-type">
        <option value="Photography">Photography</option>
        <option value="35mm">35mm</option>
        <option value="Behind the scenes">Behind the scenes</option>
        <option value="Stills">Stills</option>
        <option value="Experiments">Experiments</option>
        <option value="Tests">Tests</option>
        <option value="Other">Other</option>
      </select>

      <label for="other-caption">Caption / description</label>
      <textarea id="other-caption" placeholder="Add a short caption"></textarea>

      <label for="other-link">External link (optional)</label>
      <input id="other-link" type="url" placeholder="https://…">

      <label for="other-image">Upload image</label>
      <input id="other-image" type="file" accept="image/*">
      <img id="other-preview" class="other-preview" alt="Image preview" hidden>
      <p id="image-note" class="other-status">Choose an image to preview it.</p>

      <label class="other-check">
        <input id="other-published" type="checkbox" checked>
        Publish on the website
      </label>

      <div class="other-form-actions">
        <button id="save-other" type="submit">SAVE CONTENT</button>
        <button id="cancel-other" type="button">CANCEL</button>
      </div>
    </form>

    <div id="other-list"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/admin/config.js"></script>
<script src="/admin/app.js"></script>

<script>
(async function () {
  const db = window.MUBI_SUPABASE;
  const $ = id => document.getElementById(id);

  let items = [];
  let currentImage = "";
  let previewUrl = "";

  const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
  }[c]));

  function status(message) {
    $("other-status").textContent = message;
  }

  function safeUrl(value) {
    if (!value) return "";
    try {
      const url = new URL(value, location.origin);
      return ["https:", "http:"].includes(url.protocol) ? url.href : "";
    } catch {
      return "";
    }
  }

  function clearPreviewUrl() {
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    previewUrl = "";
  }

  function resetForm() {
    $("other-form").reset();
    $("other-id").value = "";
    $("form-heading").textContent = "ADD CONTENT";
    $("other-published").checked = true;
    $("other-image").value = "";
    $("other-preview").hidden = true;
    $("other-preview").removeAttribute("src");
    $("image-note").textContent = "Choose an image to preview it.";
    $("other-form").hidden = true;
    currentImage = "";
    clearPreviewUrl();
  }

  function renderItems() {
    const list = $("other-list");

    if (!items.length) {
      list.innerHTML = '<p class="other-status">No content yet. Click ADD CONTENT to get started.</p>';
      return;
    }

    list.innerHTML = items.map(item => {
      const image = safeUrl(item.image);

      return `
        <article class="other-card">
          <div>
            ${image
              ? `<img src="${escapeHtml(image)}" alt="${escapeHtml(item.title)}">`
              : '<div class="other-status">NO IMAGE</div>'}
          </div>
          <div>
            <h2>${escapeHtml(item.title || "Untitled")}</h2>
            <p class="other-status">${escapeHtml(item.type || "Other")} · ${item.published ? "Published" : "Hidden"}</p>
            ${item.caption ? `<p>${escapeHtml(item.caption)}</p>` : ""}
            ${item.link_url ? '<p class="other-status">External link added</p>' : ""}
            <div class="other-card-actions">
              <button type="button" data-action="edit" data-id="${escapeHtml(item.id)}">EDIT</button>
              <button type="button" data-action="toggle" data-id="${escapeHtml(item.id)}">${item.published ? "HIDE" : "PUBLISH"}</button>
              <button type="button" class="other-danger" data-action="delete" data-id="${escapeHtml(item.id)}">DELETE</button>
            </div>
          </div>
        </article>`;
    }).join("");
  }

  async function loadItems() {
    if (!db) {
      status("Database unavailable. Check admin/config.js.");
      return;
    }

    status("Loading content…");

    const {data, error} = await db
      .from("other_content")
      .select("*")
      .order("created_at", {ascending:false});

    if (error) {
      console.error("Other content:", error);
      status("Could not load content: " + error.message);
      return;
    }

    items = data || [];
    status(items.length + " item(s)");
    renderItems();
  }

  $("add-other").addEventListener("click", () => {
    resetForm();
    $("other-form").hidden = false;
    $("form-heading").textContent = "ADD CONTENT";
    $("other-form").scrollIntoView({behavior:"smooth", block:"start"});
  });

  $("refresh-other").addEventListener("click", loadItems);
  $("cancel-other").addEventListener("click", resetForm);

  $("other-image").addEventListener("change", () => {
    const file = $("other-image").files[0];
    clearPreviewUrl();

    if (!file) {
      if (currentImage) {
        $("other-preview").src = currentImage;
        $("other-preview").hidden = false;
        $("image-note").textContent = "Current image retained. Upload another to replace it.";
      } else {
        $("other-preview").hidden = true;
        $("image-note").textContent = "No image selected.";
      }
      return;
    }

    if (!file.type.startsWith("image/")) {
      status("Please select an image file.");
      $("other-image").value = "";
      return;
    }

    previewUrl = URL.createObjectURL(file);
    $("other-preview").src = previewUrl;
    $("other-preview").hidden = false;
    $("image-note").textContent = file.name;
  });

  $("other-list").addEventListener("click", async event => {
    const button = event.target.closest("button[data-action]");
    if (!button) return;

    const item = items.find(entry => String(entry.id) === button.dataset.id);
    if (!item) return;

    if (button.dataset.action === "edit") {
      resetForm();
      $("other-form").hidden = false;
      $("form-heading").textContent = "EDIT CONTENT";
      $("other-id").value = item.id;
      $("other-title").value = item.title || "";
      $("other-type").value = item.type || "Other";
      $("other-caption").value = item.caption || "";
      $("other-link").value = item.link_url || "";
      $("other-published").checked = !!item.published;

      currentImage = item.image || "";
      if (currentImage) {
        $("other-preview").src = currentImage;
        $("other-preview").hidden = false;
        $("image-note").textContent = "Current image. Upload a replacement if needed.";
      }

      $("other-form").scrollIntoView({behavior:"smooth", block:"start"});
      return;
    }

    if (button.dataset.action === "toggle") {
      const {error} = await db.from("other_content")
        .update({published: !item.published})
        .eq("id", item.id);

      if (error) {
        status("Could not update: " + error.message);
        return;
      }

      status(item.published ? "Content hidden." : "Content published.");
      await loadItems();
      return;
    }

    if (button.dataset.action === "delete") {
      if (!confirm('Delete "' + item.title + '"? This cannot be undone.')) return;

      const {error} = await db.from("other_content")
        .delete()
        .eq("id", item.id);

      if (error) {
        status("Could not delete: " + error.message);
        return;
      }

      status("Content deleted.");
      await loadItems();
    }
  });

  $("other-form").addEventListener("submit", async event => {
    event.preventDefault();

    if (!db) {
      status("Database unavailable.");
      return;
    }

    const saveButton = $("save-other");
    saveButton.disabled = true;
    status("Saving content…");

    try {
      const id = $("other-id").value;
      const file = $("other-image").files[0];
      let image = currentImage;

      if (file) {
        const bucket = window.MUBI_CONFIG?.MEDIA_BUCKET || "media";
        const extension = (file.name.split(".").pop() || "jpg")
          .toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";
        const path = "other-content/" + crypto.randomUUID() + "." + extension;

        const {error: uploadError} = await db.storage
          .from(bucket)
          .upload(path, file, {
            cacheControl:"3600",
            upsert:false,
            contentType:file.type
          });

        if (uploadError) throw uploadError;

        image = db.storage.from(bucket).getPublicUrl(path).data.publicUrl;
      }

      const link = $("other-link").value.trim();
      if (link && !safeUrl(link)) {
        throw new Error("Enter a valid URL starting with http:// or https://.");
      }

      const record = {
        title: $("other-title").value.trim(),
        type: $("other-type").value,
        caption: $("other-caption").value.trim(),
        image: image || null,
        link_url: link || null,
        published: $("other-published").checked
      };

      if (!record.title) throw new Error("Please enter a title.");

      const result = id
        ? await db.from("other_content").update(record).eq("id", id)
        : await db.from("other_content").insert(record);

      if (result.error) throw result.error;

      resetForm();
      status("Content saved successfully.");
      await loadItems();
    } catch (error) {
      console.error("Save content:", error);
      status("Could not save content: " + error.message);
    } finally {
      saveButton.disabled = false;
    }
  });

  await loadItems();
})();
</script>
</body>
</html>
