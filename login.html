<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MUBIKISHORE — ADMIN</title><link rel="stylesheet" href="/admin/styles.css"></head><body><main class="login"><div class="brand"><div class="brand-name">MUBIKISHORE</div><div class="brand-sub">ADMIN / SITE CONTENT DASHBOARD</div></div><form id="form"><label>EMAIL</label><input id="email" type="email" required><label>PASSWORD</label><input id="password" type="password" required><button>SIGN IN</button><div id="message" class="login-message"></div></form></main><div class="footer"><span>MUBIKISHORE</span><span>PRIVATE / ADMIN</span></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin/config.js"></script><script>
const client=supabase.createClient(MUBI_CONFIG.SUPABASE_URL,MUBI_CONFIG.SUPABASE_PUBLISHABLE_KEY);
form.onsubmit=async e=>{e.preventDefault();message.textContent="SIGNING IN...";const {error}=await client.auth.signInWithPassword({email:email.value,password:password.value});if(error){message.textContent=error.message;return}location.href="/admin/dashboard.html"};
</script></body></html>
