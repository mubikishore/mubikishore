<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN — MUBIKISHORE</title><link rel="stylesheet" href="/admin/styles.css"></head><body><header class="top"><div class="logo">MUBIKISHORE</div><div class="top-right"><div class="admin-label">ADMIN / SITE CONTENT DASHBOARD</div><button class="logout" id="logout">SIGN OUT</button></div></header><div class="layout"><aside class="sidebar">
<div class="section-label">CONTENT</div>
<button class="nav-button" data-nav="dashboard">Dashboard</button>
<button class="nav-button" data-nav="projects">Projects</button>
<button class="nav-button" data-nav="project-edit">Add Project</button>
<div class="section-label">STORE</div>
<button class="nav-button" data-nav="store">Products</button>
<div class="section-label">OTHER</div>
<button class="nav-button" data-nav="other">Other Content</button>
<div class="section-label">SYSTEM</div>
<button class="nav-button" data-nav="settings">Settings</button>
</aside><main class="content"><div class="eyebrow">WELCOME BACK</div><h1>ADMIN.</h1><p class="intro">Manage MUBIKISHORE website content, projects, images and store information from one place.</p><section class="cards"><div class="card"><div class="card-label">PROJECTS</div><div id="count" class="card-number">—</div></div><div class="card"><div class="card-label">PUBLISHED</div><div id="published" class="card-number">—</div></div><div class="card"><div class="card-label">MEDIA</div><div class="card-number">—</div></div></section><div class="bar"><div class="bar-title">RECENT PROJECTS</div><div id="status" class="muted">LOADING</div></div><div id="list"></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin/config.js"></script><script src="/admin/app.js"></script><script>
window.addEventListener("load",async()=>{const r=await MUBI_SUPABASE.from("projects").select("id,title,date,role,published").order("date",{ascending:false});if(r.error){status.textContent="RLS / DATABASE";list.innerHTML='<div class="notice">Run the included Supabase policies.sql file.</div>';return}const p=r.data||[];count.textContent=p.length;published.textContent=p.filter(x=>x.published).length;status.textContent="CONNECTED";list.innerHTML=p.slice(0,10).map(x=>'<div class="row"><div class="title">'+escapeHtml(x.title)+'</div><div class="small">'+escapeHtml(x.date||"")+'</div><div class="small">'+escapeHtml(x.role||"")+'</div><div class="actions"><button class="btn" onclick="location.href=\'/admin/project-edit.html?id='+x.id+'\'">EDIT</button></div></div>').join("")||'<div class="notice">No projects yet.</div>'});
</script></body></html>
